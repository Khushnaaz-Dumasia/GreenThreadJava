plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    
    def javafxVersion = '21'
    def os = System.getProperty("os.name").toLowerCase()
    def arch = System.getProperty("os.arch").toLowerCase()
    def classifier = os.contains("win") ? "win" : os.contains("mac") ? (arch.contains("aarch64") || arch.contains("arm64") ? "mac-aarch64" : "mac") : "linux"
    
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${classifier}"
    implementation "org.openjfx:javafx-fxml:${javafxVersion}:${classifier}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:${classifier}"
    implementation "org.openjfx:javafx-base:${javafxVersion}:${classifier}"

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'greenthread.Launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
